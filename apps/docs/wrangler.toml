# This Worker serves injeca.moeru.ai: the scenario lab of apps/docs.
name = "moeru-ai-injeca"
compatibility_date = "2026-11-01"
preview_urls = true
# NOTICE(dashboard-managed-routes): The custom domain lives in the Cloudflare
# dashboard rather than this deploy configuration. The workers.dev URL stays on,
# so the lab has an address before and besides the custom domain.
workers_dev = true

# Assets-only Worker. The lab is one page, so unknown paths fall back to its index.html.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
